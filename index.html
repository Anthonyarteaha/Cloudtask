<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.0</title>
 
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
 
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #1f2937;
    }
 
    .app {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
 
    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 35px 30px;
      text-align: center;
    }
 
    .header h1 {
      font-size: 34px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
 
    .header p {
      opacity: 0.9;
      font-size: 15px;
    }
 
    .version {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.2);
      font-weight: 600;
      font-size: 13px;
    }
 
    .content {
      padding: 30px;
    }
 
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
 
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e0e7ff;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
    }
 
    button {
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }
 
    #addTaskBtn {
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      padding: 14px 24px;
      font-weight: bold;
      font-size: 15px;
    }

    #addTaskBtn:hover {
      background: #4338ca;
    }
 
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
 
    .filter-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      padding: 9px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .filter-btn:hover {
      background: #f1f5f9;
    }
 
    .filter-btn.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }
 
    .task-list {
      list-style: none;
    }
 
    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
 
    .task-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4f46e5;
    }
 
    .task.completed .task-text {
      text-decoration: line-through;
      color: #94a3b8;
    }
 
    .delete-btn {
      border: none;
      background: #fef2f2;
      color: #ef4444;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
    }

    .delete-btn:hover {
      background: #fee2e2;
    }
 
    .summary {
      margin-top: 24px;
      background: #f5f3ff;
      color: #4c1d95;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      border: 1px solid #ddd6fe;
    }
 
    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 25px;
    }
 
    footer {
      text-align: center;
      border-top: 1px solid #e2e8f0;
      padding: 20px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
      background: #f8fafc;
    }

    footer strong {
      color: #334155;
    }
 
    @media (max-width: 600px) {
      .input-group {
        flex-direction: column;
      }
    }
  </style>
</head>
 
<body>
 
<div class="app">
 
  <div class="header">
    <h1>☁ CloudTask</h1>
    <p>Gestor de tareas interactivo</p>
    <span class="version">Versión 1.0</span>
  </div>
 
  <div class="content">
 
    <div class="input-group">
      <input id="taskInput" type="text" placeholder="Escribe una nueva tarea...">
      <button id="addTaskBtn">Agregar</button>
    </div>
 
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendientes</button>
      <button class="filter-btn" data-filter="completed">Completadas</button>
    </div>
 
    <ul id="taskList" class="task-list"></ul>
 
    <div class="summary">
      Tareas pendientes:
      <strong id="pendingCount">0</strong>
    </div>
 
  </div>
 
  <footer>
    CloudTask v1.0 · Práctica de Computación en la Nube<br>
    Desarrollado por: <strong>ARTEAGA NAVARRETE ANTHONY JOSE</strong>, <strong>YORDY GREGORIO MENDOZA VASQUEZ</strong> y <strong>MARIA VALERIA VALENCIA CEDEÑO</strong>
  </footer>
 
</div>
 
<script>
  const taskInput = document.getElementById("taskInput");
  const addTaskBtn = document.getElementById("addTaskBtn");
  const taskList = document.getElementById("taskList");
  const pendingCount = document.getElementById("pendingCount");
  const filterButtons = document.querySelectorAll(".filter-btn");
 
  let currentFilter = "all";
 
  let tasks = [
    { id: 1, text: "Subir proyecto a GitHub", completed: false },
    { id: 2, text: "Desplegar aplicación en Vercel", completed: false },
    { id: 3, text: "Probar aplicación desde el teléfono", completed: true }
  ];
 
  function renderTasks() {
    taskList.innerHTML = "";
 
    const filteredTasks = tasks.filter(task => {
      if (currentFilter === "pending") return !task.completed;
      if (currentFilter === "completed") return task.completed;
      return true;
    });
 
    if (filteredTasks.length === 0) {
      taskList.innerHTML =
        '<li class="empty">No hay tareas para mostrar</li>';
    }
 
    filteredTasks.forEach(task => {
      const li = document.createElement("li");
 
      li.className = "task";
 
      if (task.completed) {
        li.classList.add("completed");
      }
 
      li.innerHTML = `
        <div class="task-left">
          <input
            type="checkbox"
            ${task.completed ? "checked" : ""}
            onchange="toggleTask(${task.id})"
          >
 
          <span class="task-text">
            ${task.text}
          </span>
        </div>
 
        <button
          class="delete-btn"
          onclick="deleteTask(${task.id})"
        >
          Eliminar
        </button>
      `;
 
      taskList.appendChild(li);
    });
 
    updatePendingCount();
  }
 
  function addTask() {
    const text = taskInput.value.trim();
 
    if (text === "") {
      alert("Escribe una tarea.");
      return;
    }
 
    tasks.push({
      id: Date.now(),
      text,
      completed: false
    });
 
    taskInput.value = "";
 
    renderTasks();
  }
 
  function toggleTask(id) {
    tasks = tasks.map(task =>
      task.id === id
        ? { ...task, completed: !task.completed }
        : task
    );
 
    renderTasks();
  }
 
  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    renderTasks();
  }
 
  function updatePendingCount() {
    pendingCount.textContent =
      tasks.filter(task => !task.completed).length;
  }
 
  addTaskBtn.addEventListener("click", addTask);
 
  taskInput.addEventListener("keypress", event => {
    if (event.key === "Enter") addTask();
  });
 
  filterButtons.forEach(button => {
    button.addEventListener("click", function() {
      filterButtons.forEach(btn =>
        btn.classList.remove("active")
      );
 
      this.classList.add("active");
      currentFilter = this.dataset.filter;
 
      renderTasks();
    });
  });
 
  renderTasks();
</script>
 
</body>
</html>
